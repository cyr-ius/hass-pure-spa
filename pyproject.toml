[project]
name = "hass-pure-spa-component"
version = "0.0.0"
description = "Development environment for the Pure spa Home Assistant custom component"
requires-python = ">=3.14.2"
dependencies = []

[tool.setuptools]
# Non-packageable project (see [tool.uv] package = false).
packages = []

[dependency-groups]
lint = ["prek"]
dev = [
  "espspapy==1.0.0",
  "homeassistant",
  {include-group = "lint"},
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.codespell]
ignore-words-list = "hass"
skip = "./.*,*.csv,*.json,uv.lock"
quiet-level = 2
